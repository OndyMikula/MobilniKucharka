name: "CodeQL"

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
    branches: [ "main", "beta" ]
  schedule:
    - cron: '30 3 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache-dependency-path: MobilniKucharka/MobilniKucharka.csproj 

      - name: Cache .NET MAUI Android Workload
        id: cache-maui
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\dotnet\metadata\workloads
            C:\Program Files\dotnet\sdk-manifests
          key: ${{ runner.os }}-maui-android-10.0-codeql-${{ hashFiles('MobilniKucharka/MobilniKucharka.csproj') }}
          restore-keys: |
            ${{ runner.os }}-maui-android-10.0-codeql-

      - name: Install MAUI workload
        if: steps.cache-maui.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      - name: Generate placeholder Secrets.cs (for compilation only, not real keys)
        shell: pwsh
        run: |
          $secretsPath = "MobilniKucharka/Services/Secrets.cs"
                    @"
          namespace MobilniKucharka.Services
          {
              public static class Secrets
              {
                  public const string SpoonacularApiKey = "placeholder";
                  public const string OpenFoodFactsUserId = "placeholder";
                  public const string OpenFoodFactsPassword = "placeholder";
                  public const string NutritionixAppId = "placeholder";
                  public const string NutritionixApiKey = "placeholder";
                  public const string GitHubShareToken = "placeholder";
                  public const string DeepLApiKey = "placeholder:fx";
                  public const string FeedbackDispatchToken = "placeholder";
              }
          }
          "@ | Set-Content -Path $secretsPath -Encoding utf8

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore MobilniKucharka.sln

      - name: Build
        run: dotnet build MobilniKucharka.sln -c Release -f net10.0-android --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
