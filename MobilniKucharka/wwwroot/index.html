<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Blazor Nav Test</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div id="app">Načítám…</div>

    <div id="blazor-error-ui">
        Nastala neočekávaná chyba.
        <a href="" class="reload">Obnovit</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.setSystemNavInset = function (px) {
            document.documentElement.style.setProperty('--system-nav-inset', px + 'px');
        };

        window.setSystemTopInset = function (px) {
            document.documentElement.style.setProperty('--system-top-inset', px + 'px');
        };

        window.mkNavigateBack = function () {
            history.back();
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
